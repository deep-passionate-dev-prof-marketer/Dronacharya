<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class recording</title>
    <style>
      html, body { margin: 0; height: 100%; background: #070b14; color: #e2e8f0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
      #stage { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px; padding: 8px; box-sizing: border-box; }
      #main { flex: 1; min-height: 0; display: grid; gap: 8px; }
      #strip { display: none; height: 18%; gap: 8px; }
      #stage.presenting #strip { display: flex; }
      #stage.presenting #main { grid-template-columns: 1fr !important; }
      .tile { position: relative; background: #0f172a; border-radius: 12px; overflow: hidden; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
      #strip .tile { flex: 1; max-width: 22%; }
      .tile video { width: 100%; height: 100%; object-fit: cover; }
      .tile.screen video { object-fit: contain; background: #000; }
      .tile .avatar { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; color: #fff; }
      .tile .name { position: absolute; left: 8px; bottom: 8px; padding: 2px 8px; border-radius: 6px; background: rgba(0, 0, 0, 0.55); font-size: 12px; }
      #mark { position: absolute; right: 12px; top: 10px; font-size: 11px; color: rgba(226, 232, 240, 0.55); letter-spacing: 0.04em; }
      #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #64748b; }
    </style>
  </head>
  <body>
    <div id="stage"><div id="main"></div><div id="strip"></div></div>
    <div id="empty">Waiting for the class to begin…</div>
    <div id="mark"></div>
    <script type="module" src="/src/recording/layout.ts"></script>
  </body>
</html>
